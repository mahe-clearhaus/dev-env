# Okay.
# ctrl + hjkl = navigate panes
# alt + hjkl = navigate tabs and workspaces
# cmd + shift + [] = also navigate tabs
# cmd + [] = cycle agents
#
# Identity split (mbh vs Mahe):
# - Path: repos under ~/mbh → ~/.gitconfig-mbh via includeIf (author + personal gh creds)
# - Session: Herdr "mbh" fish panes → GH_CONFIG_DIR + GIT_AUTHOR/COMMITTER_* via
#   ~/.config/fish/conf.d/herdr-mbh-identity.fish. Global git uses `gh` as GitHub
#   credential helper, so GH_CONFIG_DIR makes `git clone` personal too. Prefer
#   `herdr-mbh` so the session server also gets that env for non-fish processes.
#
onboarding = false

[keys]
# Prefix stays ctrl+b (tmux convention).
#
# Layout principle: cmd = the direct, no-prefix navigation tier.
#   cmd+1..9                    -> workspaces (jump straight to one by number)
#   cmd+[      / cmd+]          -> agents     (cycle previous/next)
#   cmd+shift+[ / cmd+shift+]   -> tabs       (cycle previous/next)
#   alt+j      / alt+k          -> workspaces (cycle previous/next)
#   alt+h      / alt+l          -> tabs       (cycle previous/next, extra binding)
# cmd/super chords can be swallowed by the host terminal or macOS before they
# reach herdr -- if a binding below doesn't fire, check Ghostty's keybind
# config for a conflicting global/system binding on that chord.

# --- Direct jump by number ----------------------------------------------
switch_workspace = "cmd+1..9"
switch_tab = "prefix+1..9"

# --- Direct cycling, no prefix -------------------------------------------
previous_agent = "cmd+["
next_agent = "cmd+]"
previous_tab = ["cmd+shift+[", "alt+h"]
next_tab = ["cmd+shift+]", "alt+l"]
previous_workspace = "alt+j"
next_workspace = "alt+k"

# --- Panes and everything structural: behind the prefix, tmux-style ------
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
swap_pane_left = "ctrl+shift+h"
swap_pane_down = "ctrl+shift+j"
swap_pane_up = "ctrl+shift+k"
swap_pane_right = "ctrl+shift+l"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
zoom = "prefix+z"
new_tab = "prefix+c"

# --- The axis-agnostic tool ---------------------------------------------
# prefix+g opens navigate mode and it STAYS open: hjkl moves panes,
# up/down moves spaces, enter commits, esc cancels. One prefix press per
# journey rather than per hop -- useful regardless of which axis you settle on.
goto = "prefix+g"
workspace_picker = "prefix+w"

[ui]
agent_panel_sort = "spaces"

[terminal]
# New panes/tabs start fish instead of the login shell (zsh).
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"
