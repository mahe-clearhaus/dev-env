# Okay.
#
# Identity split (mbh vs Mahe):
# 
# `git` adds extra configs in ~/.gitconfig-mbh via includeif when the repo is inside ~/mbh
# `gh`: new panes in the herdr mbh session sets GH_CONFIG_DIR which changes the identity to mbh
onboarding = false

[keys]

# --- Tab cycling wihtout prefixes -------------------------------------------

# Can't figure out what I prefer. cmd+shift+[] is nice for tabs 
previous_tab = "cmd+shift+["
next_tab = "cmd+shift+]"

move_tab_previous = "cmd+alt+shift+["
move_tab_next = "cmd+alt+shift+]"

previous_workspace = ["cmd+["]
next_workspace = ["cmd+]"]
previous_agent = "cmd+alt+ctrl+shift+["
next_agent = "cmd+alt+ctrl+shift+]"

# --- Pane focus and moving and creation ------
# So let's try to get used to prefix+v too!
# split_vertical = "prefix+|"
# Defaults:
# split_verital = "prefix+v"
# split_horizontal = "prefix+minus"
# zoom = "prefix+z" <-- aka maximize
# new_tab = "prefix+c"
last_pane = "alt+tab"

# --- The axis-agnostic tool ---------------------------------------------
# prefix+g opens navigate mode and it STAYS open: hjkl moves panes,
# up/down moves spaces, enter commits, esc cancels. One prefix press per
# journey rather than per hop -- useful regardless of which axis you settle on.
goto = "prefix+g"
workspace_picker = "prefix+w"

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
[terminal]
# New panes/tabs start fish instead of the login shell (zsh).
default_shell = "/opt/homebrew/bin/fish"
shell_mode = "login"

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"
